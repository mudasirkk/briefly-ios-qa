name: iOS Interactive

# A long-running session: boots the iOS simulator, logs the QA account in via
# session injection, then exposes a control server (screenshot/tap/describe) over
# a free cloudflared tunnel so the driver can interact live. Cancel the run to end.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the session alive"
        default: "120"
      rendezvous:
        description: "ntfy.sh topic to publish the tunnel URL to"
        required: true

defaults:
  run:
    shell: bash

jobs:
  interactive:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      EXPO_DEEP_LINK: exp://u.expo.dev/6f8190b1-041d-46c8-a900-8a4e94422c3c?channel-name=preview
      INTERACTIVE_TOKEN: ${{ secrets.INTERACTIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 sims — Expo Go SDK 54 needs them)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl create qa-iphone "iPhone 16" 2>/dev/null || xcrun simctl create qa-iphone "iPhone 15")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

      - name: Install Expo Go (SDK 54)
        run: |
          curl -fsSL -o expogo.tar.gz \
            https://github.com/expo/expo-go-releases/releases/download/Expo-Go-54.0.7/Expo-Go-54.0.7.tar.gz
          APP="expogo/ExpoGo.app"
          mkdir -p "$APP" && tar -xzf expogo.tar.gz -C "$APP"
          test -f "$APP/Info.plist" || { echo "no Info.plist"; exit 1; }
          xcrun simctl install "$UDID" "$APP"

      - name: Install idb + cloudflared
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install cloudflared python@3.11
          brew tap facebook/fb
          brew install idb-companion
          # fb-idb's CLI raises under Python 3.14 (asyncio.get_event_loop removed),
          # so install it into a dedicated 3.11 venv and expose that binary as IDB.
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m venv /tmp/idbvenv
          /tmp/idbvenv/bin/pip install --quiet --upgrade pip
          /tmp/idbvenv/bin/pip install --quiet fb-idb
          echo "IDB=/tmp/idbvenv/bin/idb" >> "$GITHUB_ENV"
          /tmp/idbvenv/bin/idb --version || true
          cloudflared --version || true

      - name: Start idb companion
        run: |
          nohup idb_companion --udid "$UDID" --grpc-port 10882 >/tmp/idb_companion.log 2>&1 &
          sleep 4
          "$IDB" connect localhost 10882 || true
          "$IDB" list-targets || true
          # Prove taps work before we hand control over.
          "$IDB" ui describe-point --udid "$UDID" 100 100 || true

      - name: Mint QA session (Supabase password grant)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          resp=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}")
          AT=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          RT=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('refresh_token',''))")
          if [ -z "$AT" ] || [ -z "$RT" ]; then echo "mint failed: $(printf '%s' "$resp" | head -c 200)"; exit 1; fi
          echo "::add-mask::$AT"; echo "::add-mask::$RT"
          echo "QA_AT=$AT" >> "$GITHUB_ENV"; echo "QA_RT=$RT" >> "$GITHUB_ENV"
          echo "minted QA session (at_len=${#AT})"

      - name: Open the app (logged in via injection)
        run: |
          xcrun simctl openurl "$UDID" "$EXPO_DEEP_LINK&qa_at=$QA_AT&qa_rt=$QA_RT" || true
          sleep 2

      - name: Serve control API over a tunnel
        env:
          UDID: ${{ env.UDID }}
          SCALE: "3.0"
          PORT: "8788"
        run: |
          nohup python3 interactive/control_server.py >/tmp/control.log 2>&1 &
          sleep 3
          cat /tmp/control.log || true
          # cloudflared quick tunnels are intermittently unroutable (IPv6-only /
          # dead edge). Only publish a URL that is VERIFIED serving /health from
          # the runner; if a tunnel doesn't serve, restart cloudflared for a fresh
          # edge and try again.
          URL=""
          for attempt in 1 2 3 4 5; do
            pkill -f cloudflared || true
            : > /tmp/cf.log
            nohup cloudflared tunnel --url http://127.0.0.1:8788 --no-autoupdate >/tmp/cf.log 2>&1 &
            U=""
            for i in $(seq 1 30); do
              U=$(grep -a -m1 -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/cf.log 2>/dev/null || true)
              [ -n "$U" ] && break
              sleep 2
            done
            [ -z "$U" ] && { echo "attempt $attempt: no URL yet"; continue; }
            echo "attempt $attempt: got $U, verifying..."
            for i in $(seq 1 12); do
              code=$(curl -s -m 8 -o /dev/null -w "%{http_code}" -H "X-Token: $INTERACTIVE_TOKEN" "$U/health" || true)
              if [ "$code" = "200" ]; then URL="$U"; break; fi
              sleep 3
            done
            [ -n "$URL" ] && break
            echo "attempt $attempt: $U never served (last code=$code); restarting cloudflared"
          done
          if [ -z "$URL" ]; then echo "no working tunnel"; tail -40 /tmp/cf.log; exit 1; fi
          echo "TUNNEL_READY $URL"
          echo "::notice title=Interactive tunnel::$URL"
          curl -s -H "Title: briefly-ios-tunnel" -d "$URL" "https://ntfy.sh/${{ inputs.rendezvous }}" >/dev/null || true
          echo "published verified tunnel to ntfy"
          # Keep the session alive.
          END=$(( $(date +%s) + ${{ inputs.minutes }} * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30
            echo "alive $(date +%H:%M:%S) $URL"
          done
