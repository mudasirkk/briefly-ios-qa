name: iOS QA

on:
  workflow_dispatch:
    inputs:
      flow:
        description: "Maestro flow file (or folder) to run"
        default: flows/smoke.yaml
      channel:
        description: "EAS update channel to load in Expo Go"
        default: preview
      appearance:
        description: "Simulator UI appearance (light or dark)"
        default: light

defaults:
  run:
    shell: bash

# The sweep authenticates as ONE shared QA user, and Supabase sign-out revokes
# globally: a run that reaches the logout stop kills any concurrent run's session
# mid-flight (2026-08-20 and 2026-08-23 both lost a mode to this). Serialize every
# iOS QA run so two can never overlap; queue rather than cancel.
concurrency:
  group: ios-qa-shared-session
  cancel-in-progress: false


jobs:
  ios-qa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_DEEP_LINK: exp://u.expo.dev/6f8190b1-041d-46c8-a900-8a4e94422c3c?channel-name=${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 simulators — Expo Go SDK 54 crashes on iOS 26 runtimes)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 16 found, keeping default"; else
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl create qa-iphone "iPhone 16" 2>/dev/null || xcrun simctl create qa-iphone "iPhone 15")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl ui "$UDID" appearance "${{ inputs.appearance || 'light' }}"
          xcrun simctl list devices | grep Booted

      - name: Install Expo Go (SDK 54)
        run: |
          curl -fsSL -o expogo.tar.gz \
            https://github.com/expo/expo-go-releases/releases/download/Expo-Go-54.0.7/Expo-Go-54.0.7.tar.gz
          # The tarball is the .app bundle's CONTENTS (no wrapping dir) —
          # extract into a directory named like an app bundle.
          APP="expogo/ExpoGo.app"
          mkdir -p "$APP" && tar -xzf expogo.tar.gz -C "$APP"
          # If it actually contained a nested .app, prefer that instead.
          NESTED=$(find "$APP" -mindepth 1 -type d -name "*.app" | head -1)
          [ -n "$NESTED" ] && APP="$NESTED"
          test -f "$APP/Info.plist" || { echo "No Info.plist at $APP root"; find expogo -maxdepth 2 | head -30; exit 1; }
          echo "Installing $APP"
          xcrun simctl install "$UDID" "$APP"

      - name: Sanity-check Expo Go launches
        run: |
          mkdir -p artifacts
          xcrun simctl launch "$UDID" host.exp.Exponent
          sleep 15
          xcrun simctl io "$UDID" screenshot artifacts/00-expo-go-direct-launch.png
          xcrun simctl terminate "$UDID" host.exp.Exponent || true

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start video recording
        run: |
          mkdir -p artifacts
          xcrun simctl io "$UDID" recordVideo --codec h264 artifacts/session.mp4 &
          echo $! > video.pid

      - name: Mint QA session (Supabase password grant)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          # Mint a real session for the QA test account (same grant the app uses).
          # The app's QaAuthGate consumes these tokens from the launch URL and
          # calls setSession — logging in without automating the fragile form.
          resp=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}")
          AT=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          RT=$(printf '%s' "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('refresh_token',''))")
          if [ -z "$AT" ] || [ -z "$RT" ]; then
            echo "mint failed: $(printf '%s' "$resp" | head -c 300)"; exit 1
          fi
          echo "::add-mask::$AT"
          echo "::add-mask::$RT"
          echo "QA_AT=$AT" >> "$GITHUB_ENV"
          echo "QA_RT=$RT" >> "$GITHUB_ENV"
          echo "minted QA session: at_len=${#AT} rt_len=${#RT}"

      - name: Run Maestro flows
        id: maestro
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        run: |
          maestro test "${{ inputs.flow }}" \
            --env DEEP_LINK="$EXPO_DEEP_LINK" \
            --env QA_AT="$QA_AT" \
            --env QA_RT="$QA_RT" \
            --env APPEARANCE="${{ inputs.appearance || 'light' }}" \
            --debug-output artifacts/maestro

      - name: Flatten Maestro screenshots
        if: always()
        run: |
          # Maestro >= the version pinned here writes takeScreenshot output under
          # <debug-output>/.maestro/tests/<ts>/<flow>/takeScreenshot/<path>.png
          # instead of the flow's CWD. The comparator (and the daily-design-diff
          # routine) expect the NN-slug.png files flat at the artifact root, so
          # copy them back. Harmless no-op on Maestro versions that write to CWD.
          shopt -s nullglob
          for d in artifacts/maestro/.maestro/tests/*/*/takeScreenshot/artifacts; do
            cp "$d"/*.png artifacts/ 2>/dev/null || true
          done
          ls artifacts/*.png | wc -l

      - name: Stop video recording
        if: always()
        run: |
          kill -INT "$(cat video.pid)" 2>/dev/null || true
          sleep 5

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p artifacts/crashes
          # ReportCrash writes the .ips seconds AFTER the process dies, and
          # reports can land in Retired/ or the system-wide directory — so on a
          # failed flow, poll recursively for up to 60s before giving up.
          # (Run 32169728971's channel crash produced no artifact because the
          # old step did one non-recursive glob immediately.)
          scan() {
            find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
              -type f \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null
          }
          if [ "${{ steps.maestro.outcome }}" != "success" ]; then
            for i in $(seq 1 12); do
              [ -n "$(scan | head -1)" ] && break
              sleep 5
            done
          fi
          scan | while IFS= read -r f; do cp "$f" artifacts/crashes/ || true; done
          ls -la artifacts/crashes || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-qa-artifacts
          path: artifacts/
          if-no-files-found: warn
          include-hidden-files: true
