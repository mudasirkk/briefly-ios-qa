appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Open exactly ONCE: repeated opens shake Expo Go into its runtime dev menu.
- openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
- tapOn:
    text: "Open"
    optional: true
# Let injection load and Expo Go's first-launch dev-menu SHEET slide up.
- waitForAnimationToEnd:
    timeout: 12000
# That sheet is a NATIVE modal that renders Maestro's whole hierarchy empty while
# it's up — no text (native or RN) is matchable, so it can only be dismissed
# blind, by coordinate (its Continue button is bottom-center). Tap Continue until
# the feed's "For you" becomes visible (= sheet gone, RN tree readable again).
# This loop only TAPS — it never re-opens the link — so it can't trigger the
# runtime dev menu.
- repeat:
    times: 8
    while:
      notVisible: "For you"
    commands:
      - tapOn:
          point: "50%,92%"
      - waitForAnimationToEnd:
          timeout: 5000
- takeScreenshot: artifacts/12-logged-in
