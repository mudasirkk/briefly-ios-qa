appId: host.exp.Exponent
---
# Boot Expo Go straight into the Briefly preview update.
- openLink: ${DEEP_LINK}
# iOS confirms custom-scheme links with an 'Open in "Expo Go"?' dialog that
# appears a beat AFTER openLink returns — wait for it, then tap (don't race it).
- extendedWaitUntil:
    visible: "Open"
    timeout: 30000
- tapOn: "Open"
# Wait for the Briefly login screen JS to load (Render cold start can take ~60s).
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 150000
# Expo Go's first-launch developer-menu sheet auto-opens OVER the login form
# (covering Email/Password/Sign in). Wait for it, then dismiss via its Continue
# button so the real form is reachable. `^Continue$` avoids "Continue with Google".
- extendedWaitUntil:
    visible: "This is the developer menu"
    timeout: 25000
- tapOn:
    text: "^Continue$"
- takeScreenshot: artifacts/10-login-screen
# --- Sign in with the QA test account. Target inputs by their field labels
# (the TextInputs have no testID; the bullet password placeholder is unmatchable). ---
- tapOn:
    below: "Email"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    below: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- takeScreenshot: artifacts/11-credentials-entered
- tapOn: "Sign in"
# Landing screen after auth is the Briefs (/now) feed tab.
- extendedWaitUntil:
    visible: "Briefs"
    timeout: 120000
- takeScreenshot: artifacts/12-logged-in
