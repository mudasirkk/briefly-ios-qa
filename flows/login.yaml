appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Open exactly ONCE (repeated opens shake up Expo Go's runtime dev menu).
- openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
- tapOn:
    text: "Open"
    optional: true
# Wait for the bundle to load, injection to run, and Expo Go's first-launch
# dev-menu SHEET to settle. waitForAnimationToEnd returns once the screen is
# static — i.e. loading finished and the sheet is fully up.
- waitForAnimationToEnd:
    timeout: 25000
# Dismiss that native sheet with a SINGLE coordinate tap on its Continue button
# (bottom-center). It renders Maestro's hierarchy empty, so this is blind — but
# ONE tap only: repeated taps drift onto the runtime menu's "Go Home" and eject
# the app to SpringBoard.
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 5000
# Sheet gone -> injection has already routed to the Briefs (/now) feed.
- extendedWaitUntil:
    visible: "For you"
    timeout: 90000
- takeScreenshot: artifacts/12-logged-in
