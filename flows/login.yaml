appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Open exactly ONCE (repeated opens shake up Expo Go's runtime dev menu).
- openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
# Expo Go's first-launch dev-menu SHEET renders Maestro's hierarchy empty while
# up (only "Expo Go" / "Back to Home" are visible). Its Continue button is
# bottom-center and blind (not in the tree). Tap it until the tab bar's "Home"
# label appears — i.e. the sheet is gone and the RN tree is readable. The loop
# STOPS the instant "Home" is visible, so only ~1 effective tap lands; that is
# what keeps it off the runtime menu's "Go Home" (the earlier eject was a loop
# that never stopped because it keyed on the wrong string).
- repeat:
    times: 4
    while:
      notVisible: "Home"
    commands:
      - tapOn:
          point: "50%,92%"
      - waitForAnimationToEnd:
          timeout: 6000
- extendedWaitUntil:
    visible: "Home"
    timeout: 90000
- takeScreenshot: artifacts/12-logged-in
