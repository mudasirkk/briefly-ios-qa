appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# openLink + the iOS 'Open in Expo Go?' dialog are intermittently slow/absent in
# CI, so retry the open until the app's JS is up (login screen text appears under
# the dev-menu sheet before injection routes away).
- repeat:
    times: 5
    while:
      notVisible: "Continue with Google"
    commands:
      - openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
# Dismiss Expo Go's first-launch developer-menu sheet (native overlay; its
# Continue button is bottom-center and not in the accessibility tree).
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/10-post-inject
# QaAuthGate sets the session and the guard routes to the Briefs (/now) tab.
- extendedWaitUntil:
    visible: "Briefs"
    timeout: 150000
- takeScreenshot: artifacts/12-logged-in
