appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Key the retry on a FEED element ("For you"), so a successful injection stops the
# loop after ONE open. (Repeated opens were shaking Expo Go into its runtime dev
# menu — the source of the "Go Home" mis-tap that ejected the app.)
- repeat:
    times: 6
    while:
      notVisible: "For you"
    commands:
      - openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
# The feed is up (injection routed to /now; "For you" shows above any overlay).
# Expo Go's first-launch dev-menu sheet may still cover the lower half — dismiss
# via its Continue button (bottom-center; native overlay, not in the a11y tree).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "For you"
    timeout: 60000
- takeScreenshot: artifacts/12-logged-in
