appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Open exactly ONCE: repeated opens shake Expo Go into its runtime dev menu, a
# native overlay that hides the RN tree from Maestro.
- openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
- tapOn:
    text: "Open"
    optional: true
# Expo Go's first-launch dev-menu SHEET is a NATIVE modal — while it's up, Maestro
# cannot see any RN element beneath it (so "For you" reads invisible). Its buttons
# ARE native, though, so wait for its "Continue" (EXACT match, never the login
# screen's "Continue with Google") and tap it to dismiss. Injection has already
# logged in behind the sheet; dismissing it reveals the feed.
- extendedWaitUntil:
    visible:
      text: "^Continue$"
    timeout: 90000
- tapOn:
    text: "^Continue$"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "For you"
    timeout: 90000
- takeScreenshot: artifacts/12-logged-in
