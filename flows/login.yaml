appId: host.exp.Exponent
---
# QA session injection (bypasses the login form entirely).
#
# The app's QaAuthGate (active only when EXPO_PUBLIC_ENABLE_QA_AUTH=1, set in the
# preview environment) reads `qa_at`/`qa_rt` from the launch URL and calls
# supabase.auth.setSession — so opening the preview update with the freshly-minted
# tokens logs the QA account straight in, and the root guard routes to /now.
#
# Open exactly ONCE (repeated opens shake up Expo Go's runtime dev menu).
- openLink: ${DEEP_LINK}&qa_at=${QA_AT}&qa_rt=${QA_RT}
# The 'Open in "Expo Go"?' dialog can appear SECONDS LATE on a fresh sim —
# tapping immediately hits thin air and the untapped dialog then blocks the
# whole run (observed 2026-08-18, run 32158871742). Wait for it first.
- extendedWaitUntil:
    visible: "^Open$"
    timeout: 20000
    optional: true
- tapOn:
    text: "^Open$"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
# Expo Go's dev-menu overlay covers the app and renders Maestro's hierarchy empty
# while up. Dismiss it with its X CLOSE button (top-right ~93%,52%) — NOT the
# "Continue" button, which merely ADVANCES the intro sheet INTO the Reload/Go Home
# menu (and a stray tap there hits "Go Home" and ejects the app to SpringBoard).
# The X is blind (native overlay, not in the tree); loop it until the tab bar's
# "Home" label appears, then stop (so at most ~1 effective tap lands).
- repeat:
    times: 3
    while:
      notVisible: "Home"
    commands:
      # a late 'Open in "Expo Go"?' dialog wins over the blind X tap — only
      # taps when the dialog actually exists
      - tapOn:
          text: "^Open$"
          optional: true
      - tapOn:
          point: "93%,52%"
      - waitForAnimationToEnd:
          timeout: 5000
# The dev menu can appear ARBITRARILY late (observed 17:37 run 32165354665:
# it landed after both fixed dismissal rounds and sat through the final 60s
# wait). Keep dismissing until the tab bar is actually up: each iteration
# handles a late 'Open' dialog, taps the sheet's X position, then gives the
# app 15s to show Home. 8 iterations ≈ 2 min worst case.
- repeat:
    times: 8
    while:
      notVisible: "Home"
    commands:
      - tapOn:
          text: "^Open$"
          optional: true
      - tapOn:
          point: "93%,52%"
      - extendedWaitUntil:
          visible: "Home"
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- takeScreenshot: artifacts/12-logged-in
