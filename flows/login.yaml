appId: host.exp.Exponent
---
# Boot Expo Go straight into the Briefly preview update.
- openLink: ${DEEP_LINK}
# iOS confirms custom-scheme links with an 'Open in "Expo Go"?' dialog that
# appears a beat AFTER openLink returns — wait for it, then tap (don't race it).
- extendedWaitUntil:
    visible: "Open"
    timeout: 30000
- tapOn: "Open"
# Wait for the Briefly login screen JS to load (Render cold start can take ~60s).
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 150000
# Expo Go's first-launch developer-menu sheet slides up OVER the login form.
# It is a NATIVE overlay whose text/buttons are NOT in the accessibility tree,
# so it can only be dismissed by a coordinate tap on its "Continue" button
# (bottom-center). Let it finish animating in first.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
# Confirm the sheet is gone and the real form is reachable before proceeding.
- assertVisible: "Email"
- takeScreenshot: artifacts/10-login-screen
# --- Sign in with the QA test account. Target inputs by their field labels
# (the TextInputs have no testID; the bullet password placeholder is unmatchable). ---
- tapOn:
    below: "Email"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    below: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- takeScreenshot: artifacts/11-credentials-entered
- tapOn: "Sign in"
# Landing screen after auth is the Briefs (/now) feed tab.
- extendedWaitUntil:
    visible: "Briefs"
    timeout: 120000
- takeScreenshot: artifacts/12-logged-in
