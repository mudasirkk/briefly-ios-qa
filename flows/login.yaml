appId: host.exp.Exponent
---
# Boot Expo Go into the Briefly preview update. Both openLink and the iOS
# 'Open in "Expo Go"?' confirmation dialog are intermittently slow/absent in CI
# (some launches never bring the app forward at all), so retry the open until
# the login screen actually appears rather than assuming one shot works. The
# optional "Open" tap dismisses the dialog when it is present and is skipped
# when it is not.
- repeat:
    times: 5
    while:
      notVisible: "Continue with Google"
    commands:
      - openLink: ${DEEP_LINK}
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd:
          timeout: 10000
# Authoritative wait for the login screen JS to finish loading (bundle download
# + Render cold start can take ~60s on a cold runner).
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 150000
# Expo Go's first-launch developer-menu sheet slides up OVER the login form.
# It is a NATIVE overlay whose text/buttons are NOT in the accessibility tree,
# so it can only be dismissed by a coordinate tap on its "Continue" button
# (bottom-center). Let it finish animating in first.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
# Confirm the sheet is gone and the real form is reachable before proceeding.
- assertVisible: "Email"
- takeScreenshot: artifacts/10-login-screen
# --- Sign in with the QA test account. Both fields are tapped by COORDINATE
# (a placeholder-text tap does not focus the RN TextInput). The first field tap
# after the screen settles needs a beat for focus+keyboard before typing, or the
# characters are dropped (proven: the SECOND field always filled, the first never
# did). Wait for the login screen to settle, then wait after each field tap for
# the keyboard to slide in before inputText. Per-field screenshots verify each. ---
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "50%,60%"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${TEST_EMAIL}
- takeScreenshot: artifacts/11a-email
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "50%,70%"
- waitForAnimationToEnd:
    timeout: 3000
- inputText: ${TEST_PASSWORD}
- takeScreenshot: artifacts/11b-password
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/11-credentials-entered
- tapOn: "Sign in"
# Landing screen after auth is the Briefs (/now) feed tab.
- extendedWaitUntil:
    visible: "Briefs"
    timeout: 120000
- takeScreenshot: artifacts/12-logged-in
