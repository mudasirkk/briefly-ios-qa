appId: host.exp.Exponent
---
# Reach the onboarding "Your feed is ready" (Reveal) page via Manage interests,
# to audit long show names on the reveal grid. Login first (session injection).
- runFlow: login.yaml

# --- Account: Home tab → avatar → Manage interests ---
- tapOn:
    text: "^Home$"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Profile and settings.*"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Manage interests"
    direction: DOWN
    timeout: 20000
- tapOn: "Manage interests"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/40-taste

# --- Taste (interests pre-picked on the QA account) → Continue ---
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/41-rhythm

# --- Rhythm → Continue ---
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/42-after-rhythm

# --- Calibrate (if present): decide up to 6 cards with Keep ---
- repeat:
    times: 6
    commands:
      - tapOn:
          text: "Keep this brief"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500

# --- Building phase runs ~a few seconds; then the permission ask ---
- extendedWaitUntil:
    visible: "Want your feed ready every morning?"
    timeout: 25000
    optional: true
- takeScreenshot: artifacts/43-permission
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# --- READY page: title + 10-card reveal grid with show names ---
- extendedWaitUntil:
    visible: ".*your feed is ready.*"
    timeout: 20000
    optional: true
- takeScreenshot: artifacts/44-ready-top
- scroll
- takeScreenshot: artifacts/45-ready-scroll1
- scroll
- takeScreenshot: artifacts/46-ready-bottom
