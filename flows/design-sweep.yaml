appId: host.exp.Exponent
---
# DESIGN SWEEP — walk every major screen of Briefly and screenshot each stop.
# Consumed by the daily-design-diff routine: each numbered screenshot is compared
# against the matching Claude Design screen by a verifier agent. Names are stable
# API — the comparator maps on the NN-slug prefix; don't renumber casually.
#
# Robustness rules: navigation taps that depend on drifting UI are `optional: true`
# and every stop screenshots whatever is actually on screen — a missing element
# yields a wrong-looking screenshot (which the verifier flags) instead of a dead run.

# --- 1 · Session injection (lands on Briefs /now). The deep link must be opened
#         exactly ONCE per run (a second open shakes up Expo Go's dev menu —
#         validated the hard way 2026-08-18), so the login screen is captured at
#         the END via log-out (section 10), not by a pre-injection open. ---
- runFlow: login.yaml

# --- 1b · Pin the in-app theme to the requested appearance. The app follows its
#          own stored preference, not the system scheme: it BOOTS DARK by default
#          (ThemeContext comp-boot default) and then adopts the QA profile's
#          persisted theme_preference when it loads — so neither run may assume a
#          starting theme. The account header toggle's a11y label encodes state
#          ("Switch to dark theme" exists only while light, and vice versa), so
#          each block self-skips when the app already matches.
#          DO NOT tap "Toggle player light and dark" anymore: the player theme
#          was UNIFIED with the app theme (FeedScreen.togglePlayerTheme →
#          setPreference) — on 2026-08-19 (runs 32226194996/32226197832) that
#          second tap UN-DID the dark switch and the whole dark sweep rendered
#          light (and persisted 'light' to the QA profile). ---
- runFlow:
    when:
      true: ${APPEARANCE == 'dark'}
    commands:
      - tapOn:
          text: "^Home$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Profile and settings.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          text: "Switch to dark theme"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      true: ${APPEARANCE == 'light'}
    commands:
      - tapOn:
          text: "^Home$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Profile and settings.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          text: "Switch to light theme"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500

# --- 2 · Now tab: player card + More sheet ---
- tapOn:
    text: "^Briefs$"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/10-now-player
# pause playback AFTER the player shot — auto-advance swaps the card mid-sweep
# and races later taps (run 32163668189: capsule tap landed during a card
# transition and never navigated)
- tapOn:
    text: "^Pause$"
    optional: true
# a11y label of the rail's More button (tapping the bare "More" caption text
# does not register on the pressable — validated 2026-08-18)
- tapOn:
    text: "More options"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: artifacts/11-now-more-sheet
# dismiss: the "Close More" control is the SCRIM (absolute-fill pressable) whose
# center is covered by the sheet panel, so an element tap hits the panel instead
# (run 32162106667). Tap a point in the visible scrim strip at the top — guarded
# on the sheet's "THIS BRIEF" kicker so it only fires while the sheet is up.
# (A blind downward swipe is banned: it ejected Expo Go, run 32160474956.)
- runFlow:
    when:
      visible: "THIS BRIEF"
    commands:
      - tapOn:
          point: "50%,8%"
- waitForAnimationToEnd:
    timeout: 2000

# --- 3 · (channel section moved to 9b: opening the channel page CRASHES the
#         current preview bundle — run 32169728971 — so it runs late, where a
#         crash costs only the channel + login stops, not the whole sweep) ---

# --- 4 · Home tab (tab taps are optional: a failed stop should cost its own
#         screenshots, not the rest of the sweep) ---
- tapOn:
    text: "^Home$"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/30-home-top
# explicit swipes, NOT bare `scroll`: a centre-screen scroll lands on the hive
# mosaic which eats the gesture — 2026-08-19 home-mid/bottom captured the
# unscrolled top twice. Start the swipe low (over the Resume rail; horizontal
# lists propagate vertical gestures to the page scroll).
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- takeScreenshot: artifacts/31-home-mid
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- takeScreenshot: artifacts/32-home-bottom

# --- 5 · Discover tab ---
- tapOn:
    text: "^Discover$"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/40-discover-top
- scroll
- takeScreenshot: artifacts/41-discover-mid
- scroll
- takeScreenshot: artifacts/42-discover-bottom

# --- 6 · Search tab: empty state + live results ---
- tapOn:
    text: "^Search$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/50-search-empty
# target the FIELD by its placeholder — "Search.*" also matches the tab-bar
# label/title, so the field never got focus and 51-search-results captured the
# empty state (2026-08-19 runs)
- tapOn:
    text: ".*episodes, clips.*"
    optional: true
- inputText: "business"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: artifacts/51-search-results
- hideKeyboard

# --- 7 · Library tab ---
- tapOn:
    text: "^Library$"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/60-library-top
- scroll
- takeScreenshot: artifacts/61-library-scroll

# --- 8 · Account (Home tab → avatar), then each tab-strip pane ---
- tapOn:
    text: "^Home$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Profile and settings.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/70-account-top
# swipe the tab strip INTO VIEW before any tab tap — DD-14b (2026-08-20) made
# the identity/archetype block taller, pushing the strip below the fold; a tap
# on the off-screen "Activity" label clamped to the bottom edge and hit the tab
# bar, bouncing the whole run to Home (71-85 captured Home-bottom). Swipe start
# 65% stays clear of the tab bar / mini-player. The strip is sticky afterwards.
- swipe:
    start: 50%, 65%
    end: 50%, 25%
- tapOn:
    text: "^Activity$"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/71-account-activity
# Saved tab label carries a count since DD-14b — "Saved (1)"
- tapOn:
    text: "^Saved.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/72-account-saved
- tapOn:
    text: "^Shows$"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/73-account-shows
- tapOn:
    text: "^Stats$"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/74-account-stats
- scroll
- takeScreenshot: artifacts/75-account-scroll
- scroll
- takeScreenshot: artifacts/76-account-bottom

# --- 9 · Onboarding (re-entry via the /settings screen behind the account
#         gear — DD-22 moved the settings rows OFF the profile scroll; the
#         fresh first-run flow only exists pre-auth and OB-V2's in-flow auth is
#         still landing). The gear lives in the account header, which is
#         in-flow ABOVE the scroll, so no scrolling is needed.
#
#         2026-08-23 REWRITE for OB-V2 stages 1-6 (briefly1 #203, main 345faa4).
#         The beat order became hook > intent > auth > taste > shows > curate >
#         ctx > len > reveal, and "Manage interests" re-entry starts at `taste`.
#         The calibrate keep/skip deck is RETIRED (follow-seeding replaced it),
#         so the old "Keep this brief" x6 block is gone, and `rhythm` was split
#         into moments (ctx) + brief length (len). CTA labels per beat:
#         taste=Continue, shows=Done, curate=Done, ctx=Continue, len=Continue.
#         Slug changes: 81-ob-rhythm and 82-ob-next RETIRED; 81-ob-shows,
#         82-ob-curate, 83-ob-moments, 84-ob-length are NEW; permission/ready/
#         ready-grid shifted 83/84/85 -> 85/86/87. ---
- tapOn:
    text: "Open settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: "Manage interests"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/80-ob-taste
- tapOn:
    text: "Business"
    optional: true
- tapOn:
    text: "Technology"
    optional: true
- tapOn:
    text: "Science"
    optional: true
- tapOn:
    text: "Continue.*"
    optional: true
# shows (follow-seeding) — replaces the retired calibrate deck. It is SKIPPED
# when no suggestions load (taste falls straight through to ctx), so every stop
# below screenshots whatever is actually on screen.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: artifacts/81-ob-shows
- tapOn:
    text: "^Done$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/82-ob-curate
- tapOn:
    text: "^Done$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/83-ob-moments
- tapOn:
    text: "Continue.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: artifacts/84-ob-length
- tapOn:
    text: "Continue.*"
    optional: true
- extendedWaitUntil:
    visible: "Want your feed ready every morning?"
    timeout: 25000
    optional: true
- takeScreenshot: artifacts/85-ob-permission
- tapOn:
    text: "Maybe later"
    optional: true
- extendedWaitUntil:
    visible: ".*your feed is ready.*"
    timeout: 20000
    optional: true
- takeScreenshot: artifacts/86-ob-ready
- scroll
- takeScreenshot: artifacts/87-ob-ready-grid
# leave onboarding for the tab shell
- tapOn:
    text: "Start listening"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000

# --- 9a2 · RE-PIN the theme before the channel stops. On 2026-08-22 the DARK
#           run rendered 20-23-channel-* in LIGHT (dark at 07:11-07:12, light by
#           07:16): something between Home and here tripped the appearance
#           toggle, so the sweep produced ZERO dark channel coverage and DD-17
#           could not close. The pin is idempotent (each block self-skips when
#           the a11y label for the opposite state is absent), so re-running it
#           costs nothing and guarantees the channel stops match APPEARANCE. ---
- runFlow:
    when:
      true: ${APPEARANCE == 'dark'}
    commands:
      - tapOn:
          text: "^Home$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Profile and settings.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          text: "Switch to dark theme"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      true: ${APPEARANCE == 'light'}
    commands:
      - tapOn:
          text: "^Home$"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          text: "Profile and settings.*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          text: "Switch to light theme"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn:
    text: "^Home$"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# --- 9b · Channel page (via the show capsule, a11y "View <show>"; negative
#          lookahead excludes the "View artifact: …" pill). Runs LATE on
#          purpose: opening the channel KILLED Expo Go on the 2026-08-18
#          preview bundle (run 32169728971, filed as an app bug) — from here a
#          crash costs only the channel + login stops. ---
- tapOn:
    text: "^Briefs$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "View (?![Aa]rtifact).*"
    optional: true
# channel-page marker = the hero play pill. Its label is "Latest brief · N min"
# ONLY when the newest brief has a duration; channelData.ts falls back to
# "Play latest brief" when totalSec is 0 — and the old anchor "Latest brief.*"
# cannot match that fallback, so a channel page that loaded FINE was scored as
# a miss. That is the likeliest cause of the 2026-08-22 and 2026-08-23 double
# MISS (on 08-23 the first "View <show>" tap SUCCEEDED in the dark run, then
# the marker assert failed anyway). Match either label form.
# retry once if the first tap didn't navigate
- extendedWaitUntil:
    visible: ".*[Ll]atest brief.*"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: ".*[Ll]atest brief.*"
    commands:
      - tapOn:
          text: "View (?![Aa]rtifact).*"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
# Only shoot the channel stops if we ACTUALLY landed on the channel. On
# 2026-08-22 the light run never navigated (both taps missed) and shot four
# /now-player frames named "channel", which the comparator then judged as the
# channel screen. A miss must be visible as a miss, not as wrong-looking art.
- runFlow:
    when:
      visible: ".*[Ll]atest brief.*"
    commands:
      - takeScreenshot: artifacts/20-channel-hero
      - scroll
      - takeScreenshot: artifacts/21-channel-mid
      - scroll
      - takeScreenshot: artifacts/22-channel-about
      - scroll
      - takeScreenshot: artifacts/23-channel-bottom
- runFlow:
    when:
      notVisible: ".*[Ll]atest brief.*"
    commands:
      - takeScreenshot: artifacts/20-channel-MISSED
# back to the tab shell via the labelled back control (never the edge swipe)
- scrollUntilVisible:
    element:
      text: "^(Back|Go back)$"
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    text: "^(Back|Go back)$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# --- 10 · Login screen, LAST (log out; fresh sim each run + a new session is
#          minted per run, so signing out costs nothing) ---
- tapOn:
    text: "^Home$"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Profile and settings.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# DD-22 — Log out lives on /settings behind the gear now.
- tapOn:
    text: "Open settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- scrollUntilVisible:
    element:
      text: "^Log out$"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "^Log out$"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# the confirm dialog's destructive button is also labelled "Log out" — but a
# bare tapOn matches the PAGE's Log out button behind the alert, and an
# `index: 1` text tap ALSO failed to land (2026-08-19 runs 32226194996 +
# 32228315423: 90-login captured the settings screen + alert both times).
# Tap the alert's confirm by POINT, guarded on the alert body copy; the iOS
# alert is a fixed centered layout so the point is stable on iPhone 16.
- runFlow:
    when:
      visible: "You can sign back in any time.*"
    commands:
      - tapOn:
          point: "69%,56%"
- extendedWaitUntil:
    visible: "Continue with Google"
    timeout: 30000
    optional: true
- takeScreenshot: artifacts/90-login
